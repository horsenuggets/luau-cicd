name: Release / CD

on:
  push:
    branches:
      - release

jobs:
  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Get version and changelog
        id: version
        run: ./Scripts/GetReleaseInfo.exec.luau

      - name: Create git tag
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: ./Scripts/CreateGitTag.exec.luau "$VERSION_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: ./Scripts/CreateGitHubRelease.exec.luau "$VERSION_TAG" "$NOTES_FILE"
