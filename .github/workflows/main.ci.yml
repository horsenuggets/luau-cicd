name: Main / CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-branch-name:
    name: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Checking branch name \"$BRANCH\"."

          # Require <prefix>/<name>, with both parts in lowercase kebab-case.
          if [[ ! "$BRANCH" =~ ^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name must be \"<prefix>/<name>\" in lowercase kebab-case (e.g., \"feature/my-new-feature\")."
            exit 1
          fi

          echo "Branch name is valid."

  check-formatting:
    name: check-formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check formatting
        run: ./Scripts/CheckFormatting.exec.luau

  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Run tests
        run: ./Scripts/RunTests.exec.luau

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Setup Lune typedefs
        run: lune setup

      - name: Run static analysis
        run: ./Scripts/RunStaticAnalysis.exec.luau lune

  check-changelog-format:
    name: check-changelog-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check changelog format
        run: ./Scripts/CheckChangelogFormat.exec.luau

  check-rokit-format:
    name: check-rokit-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check rokit.toml format
        run: ./Scripts/CheckRokitFormat.exec.luau

  check-wally-format:
    name: check-wally-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check wally.toml format
        run: ./Scripts/CheckWallyFormat.exec.luau

  check-file-headers:
    name: check-file-headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check file headers
        run: ./Scripts/CheckFileHeaders.exec.luau

  check-luaurc-format:
    name: check-luaurc-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check .luaurc format
        run: ./Scripts/CheckLuaurcFormat.exec.luau

  check-json-format:
    name: check-json-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install -g prettier

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check JSON format
        run: ./Scripts/CheckJsonFormat.exec.luau

  check-script-executability:
    name: check-script-executability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check script executability
        run: ./Scripts/CheckScriptExecutability.exec.luau

  check-for-tabs:
    name: check-for-tabs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check for tabs
        run: ./Scripts/CheckNoTabs.exec.luau
